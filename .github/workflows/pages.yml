name: Validate and publish Lighting MI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public files
        uses: actions/checkout@v7
      - name: Validate public snapshot and static paths
        run: python3 scripts/validate_pages_release.py public
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload validated static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
